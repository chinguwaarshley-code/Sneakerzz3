# Server Configuration
server.port=8080
server.servlet.session.timeout=120m

# Persistent H2 File Database (stored locally in ./data/sneakylinkdb)
spring.datasource.url=jdbc:h2:file:./data/sneakylinkdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 Web Console (available at /h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SneakyLink Security & Store Settings
sneakylink.manager.password=SneakyAdmin2026!
sneakylink.store.name=SneakyLink Flagship Showroom
sneakylink.store.address=420 Cobalt Ave, Suite 100
